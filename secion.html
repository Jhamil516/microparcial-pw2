<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix – Iniciar Sesión</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      background-color: #c4a89a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #c4a89a;
      width: 340px;
      padding: 28px 32px 40px;
      border: 2px solid #e05a8a;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .netflix-logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: #E50914;
      letter-spacing: 3px;
      font-family: Arial Black, sans-serif;
      margin-bottom: 22px;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .card input[type="text"],
    .card input[type="email"],
    .card input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: #1a1a1a;
      border: none;
      border-radius: 3px;
      color: white;
      font-size: 0.88rem;
      margin-bottom: 10px;
      outline: none;
    }
    .card input::placeholder { color: #888; }

    .btn-continuar {
      width: 100%;
      padding: 11px;
      background: #E50914;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      transition: background 0.2s;
    }
    .btn-continuar:hover { background: #f40612; }

    .links {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 28px;
    }
    .links a {
      font-size: 0.78rem;
      color: #333;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }

    .divider {
      width: 100%;
      height: 1px;
      background: #b09080;
      margin-bottom: 20px;
    }

    .btn-comprar {
      background: transparent;
      border: none;
      color: #1a1a1a;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: underline;
    }
    .btn-comprar:hover { color: #E50914; }
  </style>
</head>
<body>
  <div class="card">
    <div class="netflix-logo">NETFLIX</div>
    <h2>Ingresa tu info para iniciar sesion</h2>
    <input type="email" placeholder="Correo o número de teléfono"/>
    <button class="btn-continuar" onclick="window.location.href='perfil.html'">Continuar</button>
    <div class="links">
      <a href="#">¿Necesitas ayuda?</a>
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
    <div class="divider"></div>
    <button class="btn-comprar" onclick="window.location.href='plan.html'">COMPRAR NETFLIX</button>
  </div>
</body>
</html>
